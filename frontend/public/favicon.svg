<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4324" />
      <stop offset="100%" stop-color="#2F5D3A" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" flood-color="#000" />
    </filter>
  </defs>

  <!-- Background rounded squircle badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#4ADE80" stroke-width="1.5" stroke-opacity="0.3" filter="url(#glow)" />

  <!-- Inner ambient light ring -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.15" />

  <!-- Sun / Dawn Aura behind crops -->
  <circle cx="39" cy="23" r="9" fill="url(#goldGrad)" opacity="0.35" />

  <!-- Flowing Irrigation / River Wave (The 'Flow') -->
  <path d="M12 46 C20 42, 28 50, 38 45 C46 41, 51 43, 54 44" fill="none" stroke="url(#flowGrad)" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M15 50 C23 47, 29 53, 39 49 C46 46, 49 48, 52 49" fill="none" stroke="#6EE7B7" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

  <!-- Main Sprouting Leaf (Left) -->
  <path d="M19 43 C18 32, 24 20, 34 14 C34 24, 29 36, 21 43 Z" fill="url(#leafGrad)" />
  <path d="M22 39 C26 31, 29 25, 33 16" fill="none" stroke="#065F46" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />

  <!-- Golden Wheat Ear / Grain Spikes (Right) -->
  <g transform="translate(32, 12)">
    <!-- Central Stalk -->
    <path d="M3 30 C3 22, 5 12, 7 0" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Top Grain -->
    <ellipse cx="7" cy="2" rx="2.4" ry="4.2" transform="rotate(15 7 2)" fill="url(#goldGrad)" />
    <!-- Pair 1 -->
    <ellipse cx="3.5" cy="8" rx="2.3" ry="4" transform="rotate(-30 3.5 8)" fill="url(#goldGrad)" />
    <ellipse cx="10" cy="9" rx="2.3" ry="4" transform="rotate(35 10 9)" fill="url(#goldGrad)" />
    <!-- Pair 2 -->
    <ellipse cx="2" cy="15" rx="2.3" ry="4" transform="rotate(-35 2 15)" fill="url(#goldGrad)" />
    <ellipse cx="9.5" cy="16" rx="2.3" ry="4" transform="rotate(35 9.5 16)" fill="url(#goldGrad)" />
    <!-- Pair 3 -->
    <ellipse cx="1.5" cy="22" rx="2.2" ry="3.8" transform="rotate(-40 1.5 22)" fill="url(#goldGrad)" />
    <ellipse cx="8.5" cy="23" rx="2.2" ry="3.8" transform="rotate(40 8.5 23)" fill="url(#goldGrad)" />
  </g>
</svg>

