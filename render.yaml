services:
  - type: web
    name: agriflow-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agriflow-db
          property: connectionString
      # Update this once your frontend is deployed (Vercel/Netlify) —
      # comma-separated if you need more than one allowed origin.
      - key: CORS_ORIGINS
        value: https://animated-arithmetic-c0bc7a.netlify.app
      # Prompted for in the Render dashboard on first deploy — never
      # stored in this file. Leave blank to run on the fallback-only
      # assistant.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ASSISTANT_MODEL
        value: claude-haiku-4-5-20251001

databases:
  - name: agriflow-db
    plan: free
